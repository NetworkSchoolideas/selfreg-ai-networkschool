<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid self-regulation loop</title>
  <desc id="desc">Five self-regulation links, AI roles, and the interiorization dynamic.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#176ad6"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#ff7a1a"/>
    </marker>
    <style>
      .bg{fill:#f8fbff}
      .title{font:900 28px Arial,sans-serif;fill:#0f1f33}
      .label{font:900 17px Arial,sans-serif;fill:#0f1f33}
      .small{font:800 13px Arial,sans-serif;fill:#5b6b7f}
      .stage{fill:#dff0ff;stroke:#176ad6;stroke-width:3}
      .ai{fill:#fff7ef;stroke:#ff7a1a;stroke-width:3;stroke-dasharray:12 8}
      .support{fill:#e8eefc;stroke:#315bd6;stroke-width:2}
      .blueLine{fill:none;stroke:#176ad6;stroke-width:4;marker-end:url(#blueArrow)}
      .blueThin{fill:none;stroke:#315bd6;stroke-width:2.2;marker-end:url(#blueArrow)}
      .orangeLine{fill:none;stroke:#ff7a1a;stroke-width:3;stroke-dasharray:12 8;marker-end:url(#orangeArrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="700" rx="18"/>
  <text class="title" x="348" y="68">Hybrid self-regulation loop</text>

  <rect class="support" x="54" y="112" width="178" height="440" rx="8"/>
  <text class="label" x="86" y="146">Interiorization</text>
  <rect class="support" x="82" y="190" width="122" height="50" rx="6"/>
  <text class="small" x="104" y="219">full support</text>
  <rect class="support" x="82" y="318" width="122" height="50" rx="6"/>
  <text class="small" x="112" y="347">fading</text>
  <rect class="support" x="82" y="446" width="122" height="50" rx="6"/>
  <text class="small" x="108" y="475">autonomy</text>
  <path class="blueThin" d="M143 242 V316"/>
  <path class="blueThin" d="M143 370 V444"/>

  <rect class="stage" x="498" y="112" width="150" height="58" rx="12"/>
  <text class="label" x="538" y="148">1. Goal</text>
  <rect class="stage" x="380" y="230" width="190" height="58" rx="12"/>
  <text class="label" x="420" y="266">2. Action</text>
  <rect class="stage" x="398" y="350" width="174" height="58" rx="12"/>
  <text class="label" x="426" y="386">3. Feedback</text>
  <rect class="stage" x="410" y="470" width="174" height="58" rx="12"/>
  <text class="label" x="432" y="506">4. Compare</text>
  <rect class="stage" x="440" y="590" width="190" height="58" rx="12"/>
  <text class="label" x="476" y="626">5. Correct</text>

  <path class="blueLine" d="M498 142 C420 158 396 186 458 229"/>
  <path class="blueLine" d="M475 288 V348"/>
  <path class="blueLine" d="M485 408 V468"/>
  <path class="blueLine" d="M504 528 C510 552 520 570 532 589"/>
  <path class="blueLine" d="M630 618 C760 540 728 230 648 142"/>

  <rect class="ai" x="760" y="110" width="230" height="58" rx="10"/>
  <text class="label" x="810" y="144">Goal support</text>
  <rect class="ai" x="700" y="228" width="230" height="58" rx="10"/>
  <text class="label" x="750" y="262">Step / pause</text>
  <rect class="ai" x="700" y="348" width="230" height="58" rx="10"/>
  <text class="label" x="752" y="382">Feedback filter</text>
  <rect class="ai" x="700" y="468" width="230" height="58" rx="10"/>
  <text class="label" x="756" y="502">Error trainer</text>
  <rect class="ai" x="700" y="588" width="230" height="58" rx="10"/>
  <text class="label" x="792" y="622">Mirror</text>

  <path class="blueThin" d="M648 142 H758"/>
  <path class="blueThin" d="M570 258 H698"/>
  <path class="blueThin" d="M572 378 H698"/>
  <path class="blueThin" d="M584 498 H698"/>
  <path class="blueThin" d="M630 618 H698"/>
  <path class="orangeLine" d="M875 168 C965 230 965 520 930 588"/>
  <path class="orangeLine" d="M815 588 C790 552 792 522 815 526"/>
  <text class="small" x="812" y="682">A: missing support · B: excessive rigidity</text>
</svg>
