<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Гибридный контур саморегуляции</title>
  <desc id="desc">Пять звеньев саморегуляции, роли ИИ и динамика интериоризации.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#176ad6"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#ff7a1a"/>
    </marker>
    <style>
      .bg{fill:#f8fbff}
      .title{font:900 28px Arial,sans-serif;fill:#0f1f33}
      .label{font:900 17px Arial,sans-serif;fill:#0f1f33}
      .small{font:800 13px Arial,sans-serif;fill:#5b6b7f}
      .stage{fill:#dff0ff;stroke:#176ad6;stroke-width:3}
      .ai{fill:#fff7ef;stroke:#ff7a1a;stroke-width:3;stroke-dasharray:12 8}
      .support{fill:#e8eefc;stroke:#315bd6;stroke-width:2}
      .blueLine{fill:none;stroke:#176ad6;stroke-width:4;marker-end:url(#blueArrow)}
      .blueThin{fill:none;stroke:#315bd6;stroke-width:2.2;marker-end:url(#blueArrow)}
      .orangeLine{fill:none;stroke:#ff7a1a;stroke-width:3;stroke-dasharray:12 8;marker-end:url(#orangeArrow)}
    </style>
  </defs>
