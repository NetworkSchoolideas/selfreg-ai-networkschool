<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">SelfReg AI C4 architecture</title>
  <desc id="desc">Context, containers, and components of SelfReg AI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#2f80ed"/>
    </marker>
    <style>
      .bg{fill:#f8fbfd}.area{fill:#eef4f7;stroke:#d8e0ea;stroke-width:2}.box{fill:#fff;stroke:#2f80ed;stroke-width:3}.person{fill:#edf8f4;stroke:#23967f;stroke-width:3}.external{fill:#fff1ee;stroke:#d85c4a;stroke-width:3}.title{font:900 28px Arial,sans-serif;fill:#132238}.tag{font:900 15px Arial,sans-serif;fill:#2f80ed}.label{font:900 18px Arial,sans-serif;fill:#132238}.small{font:700 13px Arial,sans-serif;fill:#5f6f82}.line{fill:none;stroke:#2f80ed;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="700" rx="18"/>
  <text class="title" x="48" y="58">C4: system purpose → services → components</text>
  <rect class="area" x="58" y="96" width="1004" height="540" rx="20"/>
  <text class="tag" x="86" y="130">C1 · Context</text>
  <rect class="person" x="92" y="184" width="190" height="86" rx="14"/>
  <text class="label" x="136" y="220">Adolescent</text>
  <text class="small" x="126" y="246">dialogue · answers</text>
  <rect class="person" x="92" y="424" width="190" height="86" rx="14"/>
  <text class="label" x="144" y="460">Teacher</text>
  <text class="small" x="124" y="486">dynamics · decision</text>
  <rect class="box" x="350" y="150" width="420" height="390" rx="18"/>
  <text class="tag" x="380" y="184">C2 · Containers</text>
  <rect class="box" x="390" y="220" width="150" height="84" rx="12"/>
  <text class="label" x="432" y="254">Mentor</text>
  <text class="small" x="424" y="280">dialogue · response</text>
  <rect class="box" x="585" y="220" width="150" height="84" rx="12"/>
  <text class="label" x="616" y="254">Dashboard</text>
  <text class="small" x="620" y="280">profile · insight</text>
  <rect class="box" x="390" y="360" width="150" height="84" rx="12"/>
  <text class="label" x="438" y="394">Data</text>
  <text class="small" x="412" y="420">answers · profiles</text>
  <rect class="box" x="585" y="360" width="150" height="84" rx="12"/>
  <text class="label" x="625" y="394">BYOK</text>
  <text class="small" x="614" y="420">key · provider</text>
  <rect class="external" x="840" y="184" width="190" height="86" rx="14"/>
  <text class="label" x="900" y="220">AI API</text>
  <text class="small" x="888" y="246">models and keys</text>
  <rect class="external" x="840" y="424" width="190" height="86" rx="14"/>
  <text class="label" x="876" y="460">Signals</text>
  <text class="small" x="884" y="486">pilot · signals</text>
  <path class="line" d="M283 228 H388"/>
  <path class="line" d="M283 468 C330 468 340 262 388 262"/>
  <path class="line" d="M540 262 H583"/>
  <path class="line" d="M660 304 V358"/>
  <path class="line" d="M735 402 H838"/>
  <path class="line" d="M735 262 H838"/>
  <text class="tag" x="86" y="586">C3 · Components</text>
  <text class="small" x="86" y="616">stage · A/B · feedback · interpretation · export</text>
</svg>
